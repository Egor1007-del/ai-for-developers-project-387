name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Check pull request source
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const number = context.payload.pull_request?.number ||
              (context.payload.issue?.pull_request && context.payload.issue.number);
            if (!number) return 'true';
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            return String(pr.head.repo?.id === pr.base.repo?.id && pr.base.repo?.id === context.payload.repository.id);
      - name: Checkout repository
        if: steps.source.outputs.result == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned tools
        if: steps.source.outputs.result == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.11
          install_args: aqua:anomalyco/opencode
          cache: 'false'
          env: 'false'
      - name: Verify project skills are discoverable
        if: steps.source.outputs.result == 'true'
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryFile(mode="w+") as output:
              subprocess.run(["opencode", "debug", "skill"], stdout=output, check=True)
              output.seek(0)
              discovered = {skill["location"] for skill in json.load(output)}

          skills = ("triage", "to-spec", "to-tickets", "implement")
          missing = [skill for skill in skills if str(pathlib.Path(".agents/skills", skill, "SKILL.md").resolve()) not in discovered]
          if missing:
              raise SystemExit("Project skills missing: " + ", ".join(missing))
          print("Project skills discovered: " + ", ".join(skills))
          PY
      - name: Run OpenCode
        if: steps.source.outputs.result == 'true'
        run: opencode github run
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: opencode/deepseek-v4.1-flash-free
          MENTIONS: /opencode,/oc
          SHARE: 'false'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
