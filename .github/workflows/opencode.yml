name: OpenCode
run-name: ${{ github.event.pull_request.number && format('opencode-budget-v1-pr-{0}', github.event.pull_request.number) || (github.event.issue.pull_request && format('opencode-budget-v1-pr-{0}', github.event.issue.number)) || format('OpenCode issue {0}', github.event.issue.number) }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Check pull request source
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const number = context.payload.pull_request?.number ||
              (context.payload.issue?.pull_request && context.payload.issue.number);
            if (!number) return 'true';
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            return String(pr.head.repo?.id === pr.base.repo?.id && pr.base.repo?.id === context.payload.repository.id);
      - name: Проверить бюджет PR
        id: budget
        if: steps.source.outputs.result == 'true' && (github.event.pull_request.number || github.event.issue.pull_request)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.actor });
            if (!['admin', 'write'].includes(permission.permission)) throw new Error('Нет права запуска агента');
            const { data: app } = await github.request('GET /apps/{app_slug}', { app_slug: 'opencode-agent' });
            if (app.permissions?.actions !== 'read') throw new Error('Невозможно подтвердить Actions: read у OpenCode Agent');
            const title = `opencode-budget-v1-pr-${number}`;
            const currentAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(currentAttempt) || currentAttempt < 1) throw new Error('Неверный номер текущей попытки');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'opencode.yml', per_page: 100
            });
            const current = runs.find(run => run.id === context.runId);
            if (!current || current.display_title !== title || current.run_attempt !== currentAttempt) {
              throw new Error('Текущая попытка не найдена в истории Actions');
            }
            let admitted = 0;
            for (const run of runs.filter(run => run.display_title === title)) {
              const last = run.id === context.runId ? currentAttempt - 1 : run.run_attempt;
              if (!Number.isInteger(last)) throw new Error('Не удалось определить номер попытки');
              for (let attempt = 1; attempt <= last; attempt++) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  ...context.repo, run_id: run.id, attempt_number: attempt, per_page: 100
                });
                const job = jobs.find(job => job.name === 'opencode');
                if (!job) throw new Error('История задания недоступна');
                if (job.conclusion !== 'skipped' && job.status === 'completed' && !job.steps?.length) {
                  throw new Error('История шагов недоступна');
                }
                const marker = job.steps?.find(step => step.name === 'Попытка допущена (budget-v1)');
                const budget = job.steps?.find(step => step.name === 'Проверить бюджет PR');
                const limit = job.steps?.find(step => step.name === 'Лимит исчерпан (budget-v1)');
                if (budget?.conclusion === 'success' && !marker && !limit) {
                  throw new Error('История решения о допуске неполна');
                }
                if (marker?.conclusion === 'success') admitted++;
                else if (job.status !== 'completed' && job.status !== 'queued' && job.status !== 'waiting') {
                  throw new Error('История другой попытки ещё не завершена');
                }
              }
            }
            core.info(`Допущено попыток: ${admitted} из 3`);
            return admitted < 3 ? 'allowed' : 'limit_exhausted';
      - name: Лимит исчерпан (budget-v1)
        if: steps.budget.outputs.result == 'limit_exhausted'
        run: 'true'
      - name: Попытка допущена (budget-v1)
        if: steps.budget.outputs.result == 'allowed'
        run: 'true'
      - name: Checkout repository
        id: checkout
        if: steps.source.outputs.result == 'true' && (steps.budget.outputs.result == 'allowed' || (!github.event.pull_request.number && !github.event.issue.pull_request))
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned tools
        id: install
        if: steps.checkout.outcome == 'success'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.11
          install_args: aqua:anomalyco/opencode
          cache: 'false'
          env: 'false'
      - name: Verify project skills are discoverable
        id: skills
        if: steps.install.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryFile(mode="w+") as output:
              subprocess.run(["opencode", "debug", "skill"], stdout=output, check=True)
              output.seek(0)
              discovered = {skill["location"] for skill in json.load(output)}

          skills = ("triage", "to-spec", "to-tickets", "implement")
          missing = [skill for skill in skills if str(pathlib.Path(".agents/skills", skill, "SKILL.md").resolve()) not in discovered]
          if missing:
              raise SystemExit("Project skills missing: " + ", ".join(missing))
          print("Project skills discovered: " + ", ".join(skills))
          PY
      - name: Run OpenCode
        if: steps.skills.outcome == 'success'
        id: agent
        continue-on-error: true
        run: |
          set +e
          timeout -k 10s 720s opencode github run
          code=$?
          if [ "$code" -eq 124 ]; then
            printf '%s\n' 'reason=timeout' >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            printf '%s\n' 'reason=agent_failed' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'reason=success' >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: opencode/deepseek-v4.1-flash-free
          OPENCODE_CONFIG_CONTENT: '{"small_model":"opencode/mimo-v2.6-flash-free"}'
          MENTIONS: /opencode,/oc
          SHARE: 'false'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      - name: Истекло время агента (budget-v1)
        if: always() && steps.agent.outputs.reason == 'timeout'
        run: 'true'
      - name: Ошибка агента (budget-v1)
        if: always() && steps.agent.outputs.reason == 'agent_failed'
        run: 'true'
      - name: Агент завершил работу (budget-v1)
        if: always() && steps.agent.outputs.reason == 'success'
        run: 'true'
      - name: Завершить с ошибкой при сбое агента
        if: always() && steps.agent.outcome == 'failure'
        run: exit 1
